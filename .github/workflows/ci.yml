name: TypeScript CI

on:
    push:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Install dependencies
              run: npm ci

            - name: Wait 10 seconds
              run: sleep 10

            - name: Build application
              run: npm run build

            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: app-build
                  path: dist/

    deploy:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # - name: Setup Node.js
            #   uses: actions/setup-node@v4
            #   with:
            #       node-version: 24

            - name: Install dependencies
              run: npm ci

            # - name: Build application
            #   run: npm run build

            # - name: Wait 30 seconds
            #   run: sleep 30

            - name: Download build artifact
              uses: actions/download-artifact@v4
              with: 
                name: app-build
                path: dist/
            
            - name: Show build files
              run: ls -la dist/

            - name: Deploy
              run: npm run start
